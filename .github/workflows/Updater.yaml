name: Domain Checker & Updater

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  FILE_PATH: domain.json
  TZ: Europe/Istanbul

jobs:
  Domain_Check:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      - name: Python installation
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install needed packages
        run: |
          python -m pip install --upgrade pip
          pip install requests cloudscraper

      - name: Check domains and update
        run: |
          python - <<'EOF'
          import json
          from urllib.parse import urlparse
          from cloudscraper import CloudScraper

          scraper = CloudScraper()

          # ============================================================
          # CONFIGURATION
          # ============================================================

          file_path = '${{ env.FILE_PATH }}'

          # ============================================================
          # FUNCTIONS
          # ============================================================

          def get_final_url(url, timeout=15):
              """Follow redirects and return scheme://netloc only."""
              try:
                  url = url.strip().rstrip('/')

                  response = scraper.get(
                      url,
                      allow_redirects=True,
                      timeout=timeout,
                      headers={
                          'User-Agent':
                              'Mozilla/5.0 (Windows NT 10.0; Win64; x64) '
                              'AppleWebKit/537.36 '
                              '(KHTML, like Gecko) '
                              'Chrome/140.0.0.0 Safari/537.36'
                      }
                  )

                  final_url = response.url.rstrip('/')

                  if response.history:
                      print("  Redirect chain:")
                      for redirect in response.history:
                          print(f"    {redirect.status_code}: {redirect.url}")
                      print(f"    {response.status_code}: {response.url}")
                  else:
                      print(f"  No redirect (HTTP {response.status_code})")

                  parsed = urlparse(final_url)

                  if not parsed.scheme or not parsed.netloc:
                      print(f"  ✗ Invalid final URL: {final_url}")
                      return None

                  return f"{parsed.scheme}://{parsed.netloc}"

              except Exception as e:
                  print(f"  ✗ Request error ({url}): {str(e)}")
                  return None


          # ============================================================
          # READ DOMAIN JSON FILE
          # ============================================================

          try:
              with open(file_path, 'r', encoding='utf-8') as f:
                  data = json.load(f)
          except FileNotFoundError:
              print(f"File not found: {file_path}")
              exit(1)
          except json.JSONDecodeError as e:
              print(f"Invalid JSON: {e}")
              exit(1)
          except Exception as e:
              print(f"File read error: {e}")
              exit(1)

          original_data = json.dumps(data, indent=2, ensure_ascii=False)

          changes_made = False
          checked = 0
          skipped = 0
          updated = 0

          print("==============================================")
          print(" Domain Checker & Updater (JSON)")
          print("==============================================")
          print()
          print(f"File: {file_path}")
          print(f"Total entries: {len(data)}")
          print()

          # ============================================================
          # CHECK EVERY DOMAIN
          # ============================================================

          for entry in data:
              name = entry.get('name', '')
              original_url = entry.get('baseUrl', '').rstrip('/')
              update_check = entry.get('updateCheck', False)

              # --------------------------------------------------------
              # updateCheck disabled → skip (this is the global opt-out)
              # --------------------------------------------------------
              if not update_check:
                  skipped += 1
                  print(f"⏭️  updateCheck=false: {name}")
                  print(f"    Keeping: {original_url}")
                  print()
                  continue

              # --------------------------------------------------------
              # Missing URL
              # --------------------------------------------------------
              if not original_url:
                  print(f"⚠️  No baseUrl for: {name}")
                  print()
                  continue

              # --------------------------------------------------------
              # Check domain
              # --------------------------------------------------------
              checked += 1
              print(f"Checking: {name}")
              print(f"  Current URL: {original_url}")

              final_url = get_final_url(original_url)

              if not final_url:
                  print("  ✗ Could not determine final URL")
                  print("  → Keeping current URL")
                  print()
                  continue

              if final_url != original_url:
                  print(f"  ✓ Final URL: {final_url}")
                  entry['baseUrl'] = final_url
                  changes_made = True
                  updated += 1
                  print(f"  ✓ Updated: {name} -> {final_url}")
              else:
                  print("  → No changes")

              print()

          # ============================================================
          # WRITE CHANGES
          # ============================================================

          new_data = json.dumps(data, indent=2, ensure_ascii=False)

          if changes_made and new_data != original_data:
              try:
                  with open(file_path, 'w', encoding='utf-8', newline='\n') as f:
                      f.write(new_data)
                      f.write('\n')

                  print("==============================================")
                  print("✓ File updated successfully!")
                  print("==============================================")
              except Exception as e:
                  print(f"✗ Failed to write file: {e}")
                  exit(1)
          else:
              print("==============================================")
              print("→ No changes needed.")
              print("==============================================")

          print()
          print(f"Summary: checked={checked}, updated={updated}, "
                f"skipped={skipped}, total={len(data)}")

          EOF

      - name: Save changes
        run: |
          git config user.name 'Domain Updater'
          git config user.email 'bot@github-actions'

          git add ${{ env.FILE_PATH }}

          if git diff --staged --quiet; then
            echo "No changes, skipping commit"
            exit 0
          fi

          CURRENT_TIME=$(date +'%Y-%m-%d %H:%M')

          git commit \
            -m "♻️ Domain updated - $CURRENT_TIME"

          git push
